<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planes Nearby – Live Flight Map</title>
<meta name="description" content="Live map of the aircraft flying near you, from community ADS-B receivers: type, airline, route, altitude, speed, photo and flight trail.">
<meta name="theme-color" content="#07090d">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap">
<link rel="stylesheet" href="../vendor/leaflet.css">
<link rel="stylesheet" href="planes.css?v=20261112p">
</head>
<body class="intro">
<div id="app"><div id="main">
 <header class="glass">
  <h1><span class="sym" aria-hidden="true">✈</span>Planes Nearby</h1>
  <div class="controls">
   <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search callsign, registration, type…" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Search planes by callsign, registration or type" enterkeyhint="search"></label>
   <select id="radius" aria-label="Search radius"><option value="25">25 nm · 46 km</option><option value="50" selected>50 nm · 93 km</option><option value="100">100 nm · 185 km</option></select>
   <button id="listBtn" class="hbtn" type="button" aria-label="List of planes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>List</span></button>
   <div id="count" aria-live="polite"><span class="live"></span><span class="ct">Loading live data…</span></div>
  </div>
 </header>
 <div id="map" role="application" aria-label="Map of aircraft"></div>
 <button id="here" class="pill glass" type="button" hidden>Search this area</button>
 <aside id="panel" aria-label="Aircraft details"><div class="grab" id="pgrab"></div><button class="close" id="pclose" type="button" aria-label="Close">✕</button><div id="pbody"></div></aside>
 <aside id="list" class="glass" aria-label="Planes in the area"><div class="lh"><b>Planes</b><span id="lcount"></span><button class="close" id="lclose" type="button" aria-label="Close list">✕</button></div><div id="lbody"></div></aside>
 <div id="geo" class="glass" role="dialog" aria-labelledby="geoT" hidden>
  <div class="gi" aria-hidden="true">◎</div>
  <b id="geoT">See the planes flying near you</b>
  <p>Allow location access to center the map on where you are. Your location stays in your browser; only the map center is sent (rounded) to the flight-data service.</p>
  <div class="gb"><button id="geoYes" type="button" class="primary">Use my location</button><button id="geoNo" type="button">Not now – show New York</button></div>
 </div>
 <div id="about"><button id="aboutBtn" class="glass" type="button">About &amp; sources</button><a class="glass xlink" href="../" title="World nuclear power plants map">☢ Nuclear<span class="xl"> plants map</span></a><div id="aboutBox"></div></div>
 <div id="toast" role="status" aria-live="polite"></div>
 <div id="tip"></div>
</div></div>
<script src="../vendor/leaflet.js"></script>
<script>
// Leaflet fallback (same CDN version as the nuclear map) if the self-hosted copy fails
if(!window.L){document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');}
</script>
<script src="types.js?v=20261112p" defer></script>
<script src="app.js?v=20261112p" defer></script>
</body>
</html>
